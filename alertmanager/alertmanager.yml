# Alertmanager -> Event Gateway webhook (SUGGESTED_PLAN.md §6.1, §6.3).
# The gateway (POST /alerts) is not built yet; until it is, Alertmanager
# logs failed deliveries and retries. Alerts are still visible at :9093.

route:
  receiver: gateway
  # One notification per alert per service; the gateway does the cross-service
  # grouping along the dependency chain.
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: gateway
    webhook_configs:
      - url: http://gateway:8000/alerts
        # The verifier uses resolved notifications to confirm a fix
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  # Service down already explains its latency/error alerts
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [alertname=~"HighLatency|HighErrorRate"]
    equal: ["service"]
